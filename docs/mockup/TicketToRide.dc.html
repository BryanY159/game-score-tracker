<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket to Ride turn tracker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1F2430; font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 52px 20px 10px; display: flex; align-items: center; gap: 12px">
<button aria-label="Back" style="width: 44px; height: 44px; border: none; background: #F2F3F5; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1F2430"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 22px; font-weight: 800">Ticket to Ride</span>
<span style="font-size: 14px; color: #5F6470">Turn 23</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; background: #F2F3F5; border-radius: 22px; padding: 0 6px 0 14px; height: 44px">
<span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">54:02</span>
<button aria-label="Pause" style="width: 34px; height: 34px; border: none; border-radius: 17px; background: #1F2430; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg></button>
</div>
</div>

<div style="margin: 6px 16px 0; background: #1D4ED8; color: #FFFFFF; border-radius: 28px; padding: 14px 18px; display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 26px">🐢</span>
<div style="flex: 1; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 14px">Current turn</span><span style="font-size: 24px; font-weight: 800">Sam</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2"><span style="font-size: 14px">Trains left</span><span style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">18</span></div>
</div>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700; color: #5F6470">Claim a route</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="height: 60px; border: 1.5px solid #1F2430; border-radius: 16px; background: #FFFFFF; color: #1F2430; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="font-size: 22px; font-weight: 800">1</span><span style="font-size: 13px; color: #5F6470">1 pt</span></button>
<button style="height: 60px; border: 1.5px solid #1F2430; border-radius: 16px; background: #FFFFFF; color: #1F2430; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="font-size: 22px; font-weight: 800">2</span><span style="font-size: 13px; color: #5F6470">2 pts</span></button>
<button style="height: 60px; border: 1.5px solid #1F2430; border-radius: 16px; background: #FFFFFF; color: #1F2430; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="font-size: 22px; font-weight: 800">3</span><span style="font-size: 13px; color: #5F6470">4 pts</span></button>
<button style="height: 60px; border: 1.5px solid #1F2430; border-radius: 16px; background: #FFFFFF; color: #1F2430; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="font-size: 22px; font-weight: 800">4</span><span style="font-size: 13px; color: #5F6470">7 pts</span></button>
<button style="height: 60px; border: 1.5px solid #1F2430; border-radius: 16px; background: #FFFFFF; color: #1F2430; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="font-size: 22px; font-weight: 800">5</span><span style="font-size: 13px; color: #5F6470">10 pts</span></button>
<button style="height: 60px; border: 1.5px solid #1F2430; border-radius: 16px; background: #FFFFFF; color: #1F2430; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="font-size: 22px; font-weight: 800">6</span><span style="font-size: 13px; color: #5F6470">15 pts</span></button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 52px; border: none; border-radius: 16px; background: #F2F3F5; color: #1F2430; font-family: inherit; font-size: 15px; font-weight: 700">Draw train cards</button>
<button style="height: 52px; border: none; border-radius: 16px; background: #F2F3F5; color: #1F2430; font-family: inherit; font-size: 15px; font-weight: 700">Draw tickets</button>
</div>
</div>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5F6470; padding: 0 8px"><span>Turn order</span><span>Trains · Points</span></div>
<div style="background: #1D4ED8; color: #FFFFFF; border-radius: 24px; height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px"><span style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 18px">🐢</span><span style="flex: 1; font-size: 16px; font-weight: 700">Sam · now</span><span style="font-size: 14px; font-variant-numeric: tabular-nums">18</span><span style="font-size: 22px; font-weight: 800; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums">61</span></div>
<div style="background: #C0392B; color: #FFFFFF; border-radius: 24px; height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px"><span style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 18px">🦊</span><span style="flex: 1; font-size: 16px; font-weight: 700">Alex</span><span style="font-size: 14px; font-variant-numeric: tabular-nums">9</span><span style="font-size: 22px; font-weight: 800; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums">78</span></div>
<div style="background: #1C1C1E; color: #FFFFFF; border-radius: 24px; height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px"><span style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 18px">🌵</span><span style="flex: 1; font-size: 16px; font-weight: 700">Jordan</span><span style="font-size: 14px; font-variant-numeric: tabular-nums">14</span><span style="font-size: 22px; font-weight: 800; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums">66</span></div>
<div style="background: #EAB308; color: #FFFFFF; border-radius: 24px; height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px"><span style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 18px">🐙</span><span style="flex: 1; font-size: 16px; font-weight: 700">Riley</span><span style="font-size: 14px; font-variant-numeric: tabular-nums">21</span><span style="font-size: 22px; font-weight: 800; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums">49</span></div>
</div>

<div style="margin: 12px 16px 0; padding: 10px 14px; background: #F2F3F5; border-radius: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<span style="font-weight: 700; color: #5F6470">Last turns</span>
<span>Riley claimed a 4-route · +7</span>
<span>Jordan drew train cards</span>
</div>

<div style="flex: 1"></div>
<div style="border-top: 1px solid #E4E6EA; padding: 8px 12px 28px; display: flex; align-items: center; gap: 8px; background: #FFFFFF">
<button style="flex: 1; height: 52px; border: none; background: transparent; color: #1F2430; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg>Undo</button>
<button style="flex: 1; height: 52px; border: none; background: transparent; color: #1F2430; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Turn log</button>
<button style="flex: 2; height: 52px; border: none; border-radius: 16px; background: #1F2430; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800">End game</button>
<button style="flex: 1; height: 52px; border: none; background: transparent; color: #1F2430; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
