<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flip 7 keypad from score tap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F2430}a:hover{color:#1F2430}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1F2430; font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 52px 20px 10px; display: flex; align-items: center; gap: 12px">
<button aria-label="Back" style="width: 44px; height: 44px; border: none; background: #F2F3F5; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1F2430"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 800">Flip 7</span><span style="font-size: 14px; color: #5F6470">Round 6 · Dealer: Sam</span></div>
<div style="display: flex; align-items: center; gap: 8px; background: #F2F3F5; border-radius: 22px; padding: 0 6px 0 14px; height: 44px">
<span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">32:14</span>
<button aria-label="Pause" style="width: 34px; height: 34px; border: none; border-radius: 17px; background: #1F2430; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg></button>
</div>
</div>

<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5F6470; padding: 0 8px; white-space: nowrap"><span>Typing Riley's score</span><span>Round · Total</span></div>
<sc-for list="{{players}}" as="p" hint-placeholder-count="4">
<div style="background: {{p.color}}; color: #FFFFFF; border-radius: 24px; height: 48px; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 8px; box-shadow: {{p.ring}}">
<span style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 20px">{{p.emoji}}</span>
<span style="flex: 1; font-size: 16px; font-weight: 700; white-space: nowrap">{{p.name}}</span>
<button aria-label="Type round score" style="height: 32px; min-width: 52px; border: {{p.chipBorder}}; background: {{p.chipBg}}; color: {{p.chipText}}; border-radius: 16px; padding: 0 10px; font-family: inherit; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">{{p.round}}</button>
<span style="font-size: 24px; font-weight: 800; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums">{{p.total}}</span>
</div>
</sc-for>
</div>

<div style="margin: 12px 16px 0; background: #F2F3F5; border-radius: 24px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 700; white-space: nowrap">Riley</span>
<button style="height: 36px; border: 1.5px solid #1F2430; background: #FFFFFF; color: #1F2430; border-radius: 18px; padding: 0 12px; font-family: inherit; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="11" height="15" rx="2"></rect><path d="M9 21h9a2 2 0 002-2V8"></path></svg>Back to cards</button>
</div>
<div style="font-size: 40px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; line-height: 1">23</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">1</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">2</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">3</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #B91C1C; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 800">Bust</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">4</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">5</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">6</button>
<button style="height: 48px; border: 1.5px solid #1F2430; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 15px; font-weight: 800">Flip 7!</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">7</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">8</button>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">9</button>
<button aria-label="Delete" style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"></path><path d="M13 9l4 6M17 9l-4 6"></path></svg></button>
<div></div>
<button style="height: 48px; border: none; border-radius: 14px; background: #FFFFFF; color: #1F2430; font-family: inherit; font-size: 22px; font-weight: 700">0</button>
<button style="grid-column: span 2; height: 48px; border: none; border-radius: 14px; background: #1F2430; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px">Next player <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div style="flex: 1"></div>
<div style="border-top: 1px solid #E4E6EA; padding: 8px 12px 28px; display: flex; align-items: center; gap: 8px; background: #FFFFFF">
<button style="flex: 1; height: 52px; border: none; background: transparent; color: #1F2430; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg>Undo</button>
<button style="flex: 1; height: 52px; border: none; background: transparent; color: #1F2430; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Rounds</button>
<button style="flex: 2; height: 52px; border: none; border-radius: 16px; background: #1F2430; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Confirm round</button>
<button style="flex: 1; height: 52px; border: none; background: transparent; color: #1F2430; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chip = { chipBorder: '1.5px solid rgba(255,255,255,0.7)', chipBg: 'rgba(255,255,255,0.18)', chipText: '#FFFFFF' };
const active = { chipBorder: '2px solid #FFFFFF', chipBg: '#FFFFFF', chipText: '#1F2430' };
const players = [
Object.assign({ name: 'Alex', emoji: '🦊', color: '#C0392B', round: '+31', total: 212, ring: 'none' }, chip),
Object.assign({ name: 'Sam', emoji: '🐢', color: '#1D4ED8', round: 'Bust', total: 176, ring: 'none' }, chip),
Object.assign({ name: 'Jordan', emoji: '🌵', color: '#15803D', round: '+58', total: 169, ring: 'none' }, chip),
Object.assign({ name: 'Riley', emoji: '🐙', color: '#EAB308', round: '23', total: 141, ring: '0 0 0 3px #FFFFFF, 0 0 0 5px #1F2430' }, active)
];
return { players: players };
}
}
</script>
</body>
</html>
